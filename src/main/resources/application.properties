# 临时环境租约与回收编排 —— 本地默认配置
# 同时存活（未终结）环境的容量配额
ephemeral-env.max-active-leases=2
# 默认租期（毫秒）：60s
ephemeral-env.default-ttl-millis=60000
# 状态持久化文件（留空则使用工作目录下 .ephemeral-env/leases.json）
ephemeral-env.data-file=
# 后台到期回收调度器默认关闭；本地演示时可改为 true
ephemeral-env.scheduler-enabled=false
# 回收扫描间隔（毫秒）
ephemeral-env.reclaim-interval-millis=5000
